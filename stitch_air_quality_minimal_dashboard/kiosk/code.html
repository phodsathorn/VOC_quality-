<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-primary-fixed":"#00174b","on-secondary":"#ffffff","surface":"#faf8ff","surface-tint":"#0053db","outline":"#737686","on-surface-variant":"#434655","error":"#ba1a1a","secondary-container":"#d0e1fb","on-secondary-fixed":"#0b1c30","inverse-primary":"#b4c5ff","surface-bright":"#faf8ff","background":"#faf8ff","surface-container-lowest":"#ffffff","inverse-on-surface":"#eef0ff","surface-container":"#eaedff","on-tertiary":"#ffffff","on-error-container":"#93000a","surface-container-low":"#f2f3ff","on-primary":"#ffffff","primary-fixed":"#dbe1ff","on-surface":"#131b2e","secondary-fixed-dim":"#b7c8e1","surface-container-highest":"#dae2fd","on-tertiary-fixed":"#360f00","on-tertiary-container":"#ffede6","secondary":"#505f76","on-tertiary-fixed-variant":"#7d2d00","outline-variant":"#c3c6d7","on-error":"#ffffff","on-secondary-fixed-variant":"#38485d","primary":"#004ac6","tertiary-fixed":"#ffdbcd","primary-fixed-dim":"#b4c5ff","tertiary":"#943700","inverse-surface":"#283044","surface-container-high":"#e2e7ff","on-primary-container":"#eeefff","surface-dim":"#d2d9f4","on-secondary-container":"#54647a","tertiary-container":"#bc4800","error-container":"#ffdad6","on-background":"#131b2e","secondary-fixed":"#d3e4fe","on-primary-fixed-variant":"#003ea8","surface-variant":"#dae2fd","primary-container":"#2563eb","tertiary-fixed-dim":"#ffb596"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"space-2xl":"3rem","space-sm":"0.5rem","space-md":"1rem","space-lg":"1.5rem","space-xs":"0.25rem","gutter":"1.5rem","margin":"2rem","space-xl":"2rem"},"fontFamily":{"headline-sm":["Inter"],"display-metric":["Inter"],"metric-large":["Inter"],"detail-link":["Inter"],"badge-label":["Inter"],"body-medium":["Inter"],"body-default":["Inter"],"card-label":["Inter"]},"fontSize":{"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"display-metric":["56px",{"lineHeight":"60px","letterSpacing":"-0.03em","fontWeight":"700"}],"metric-large":["44px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"600"}],"detail-link":["14px",{"lineHeight":"20px","fontWeight":"500"}],"badge-label":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"body-medium":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-default":["14px",{"lineHeight":"20px","fontWeight":"400"}],"card-label":["14px",{"lineHeight":"20px","letterSpacing":"0.05em","fontWeight":"500"}]}}}}</script></head><body class="bg-surface font-body-default text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex items-center justify-center p-margin"><div class="flex flex-col w-full max-w-7xl mx-auto gap-6 select-none">
<!-- Top Section: Status Banner Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-6 flex items-center justify-center gap-5 transition-all">
<div class="w-14 h-14 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[44px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-headline-sm text-[32px] leading-[40px] font-bold text-on-surface tracking-tight">
      บรรยากาศปกติ — ปลอดภัย
    </span>
</div>
<!-- Middle Section: 3 Heavy Touch Action Targets (Glove Ergonomics) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
<!-- Action 1: Emergency Trigger -->
<button class="group relative min-h-[190px] h-48 rounded-xl bg-error text-on-error p-6 flex flex-col items-center justify-center gap-4 shadow-sm active:scale-[0.98] transition-all duration-150 cursor-pointer text-center" onclick="triggerFeedback(this, 'ส่งสัญญาณแจ้งเหตุฉุกเฉินแล้ว')" type="button">
<div class="w-16 h-16 rounded-full bg-on-error/15 flex items-center justify-center">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">e911_emergency</span>
</div>
<span class="font-headline-sm text-[26px] leading-[32px] font-bold text-on-error tracking-normal">
        แจ้งเหตุฉุกเฉิน
      </span>
</button>
<!-- Action 2: Max Exhaust Booster -->
<button class="group relative min-h-[190px] h-48 rounded-xl bg-primary-container text-on-primary p-6 flex flex-col items-center justify-center gap-4 shadow-sm active:scale-[0.98] transition-all duration-150 cursor-pointer text-center" onclick="triggerFeedback(this, 'ระบบระบายอากาศทำงาน 100%')" type="button">
<div class="w-16 h-16 rounded-full bg-on-primary/15 flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] animate-spin-slow">mode_fan</span>
</div>
<span class="font-headline-sm text-[26px] leading-[32px] font-bold text-on-primary tracking-normal">
        เร่งพัดลม 100%
      </span>
</button>
<!-- Action 3: Maintenance Log Entry -->
<button class="group relative min-h-[190px] h-48 rounded-xl bg-inverse-surface text-inverse-on-surface p-6 flex flex-col items-center justify-center gap-4 shadow-sm active:scale-[0.98] transition-all duration-150 cursor-pointer text-center" onclick="triggerFeedback(this, 'เปิดสมุดบันทึกซ่อมบำรุง')" type="button">
<div class="w-16 h-16 rounded-full bg-inverse-on-surface/15 flex items-center justify-center">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">build</span>
</div>
<span class="font-headline-sm text-[26px] leading-[32px] font-bold text-inverse-on-surface tracking-normal">
        บันทึกงานซ่อมบำรุง
      </span>
</button>
</div>
<!-- Bottom Section: 2 Large Telemetry Dial Modules -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
<!-- Telemetry Dial 1: TVOC -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm flex flex-col items-center justify-center relative overflow-hidden">
<div class="w-full flex items-center justify-between px-4 mb-2">
<span class="font-card-label text-[20px] font-semibold text-secondary tracking-wider">สารระเหยรวม (TVOC)</span>
<span class="px-4 py-1.5 rounded-full bg-surface-container text-primary font-badge-label text-[16px] font-bold">
          ปกติ
        </span>
</div>
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Minimal Circular Radial Track -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 200 200">
<circle class="text-surface-container" cx="100" cy="100" fill="none" r="82" stroke="currentColor" stroke-width="12"></circle>
<!-- Safe Level Arc (64 ppb on 0-300 scale ~ 21% fill) -->
<circle class="text-primary-container" cx="100" cy="100" fill="none" r="82" stroke="currentColor" stroke-dasharray="515.22" stroke-dashoffset="400" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Metric Central Core -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
<span class="font-display-metric text-[60px] leading-[64px] font-bold text-on-surface tracking-tight">64</span>
<span class="font-body-medium text-[22px] font-semibold text-secondary mt-1">ppb</span>
</div>
</div>
<div class="mt-2 text-center">
<span class="font-body-default text-[18px] text-secondary">เกณฑ์ปลอดภัย: ต่ำกว่า 220 ppb</span>
</div>
</div>
<!-- Telemetry Dial 2: PM2.5 -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm flex flex-col items-center justify-center relative overflow-hidden">
<div class="w-full flex items-center justify-between px-4 mb-2">
<span class="font-card-label text-[20px] font-semibold text-secondary tracking-wider">ฝุ่นละอองละเอียด (PM2.5)</span>
<span class="px-4 py-1.5 rounded-full bg-surface-container text-primary font-badge-label text-[16px] font-bold">
          ปกติ
        </span>
</div>
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Minimal Circular Radial Track -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 200 200">
<circle class="text-surface-container" cx="100" cy="100" fill="none" r="82" stroke="currentColor" stroke-width="12"></circle>
<!-- Safe Level Arc (14 ug/m3 on 0-75 scale ~ 19% fill) -->
<circle class="text-primary-container" cx="100" cy="100" fill="none" r="82" stroke="currentColor" stroke-dasharray="515.22" stroke-dashoffset="418" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Metric Central Core -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
<span class="font-display-metric text-[60px] leading-[64px] font-bold text-on-surface tracking-tight">14</span>
<span class="font-body-medium text-[22px] font-semibold text-secondary mt-1">µg/m³</span>
</div>
</div>
<div class="mt-2 text-center">
<span class="font-body-default text-[18px] text-secondary">เกณฑ์ปลอดภัย: ต่ำกว่า 37.5 µg/m³</span>
</div>
</div>
</div>
<!-- Interactive Feedback Overlay (Temporary toast for industrial gloves) -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-8 py-4 rounded-full shadow-xl font-headline-sm text-[22px] opacity-0 pointer-events-none transition-opacity duration-200 z-50 flex items-center gap-3" id="touch-ack">
<span class="material-symbols-outlined text-[32px] text-primary-fixed">verified</span>
<span id="touch-ack-text">บันทึกคำสั่งเรียบร้อย</span>
</div>
</div>
<script>
  let ackTimeout;
  function triggerFeedback(btn, message) {
    const toast = document.getElementById('touch-ack');
    const toastText = document.getElementById('touch-ack-text');
    if (!toast || !toastText) return;

    toastText.textContent = message;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');

    clearTimeout(ackTimeout);
    ackTimeout = setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2400);
  }
</script></main></body></html>
