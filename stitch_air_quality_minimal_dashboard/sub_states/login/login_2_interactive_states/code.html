<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-primary-fixed":"#00174b","on-secondary":"#ffffff","surface":"#faf8ff","surface-tint":"#0053db","outline":"#737686","on-surface-variant":"#434655","error":"#ba1a1a","secondary-container":"#d0e1fb","on-secondary-fixed":"#0b1c30","inverse-primary":"#b4c5ff","surface-bright":"#faf8ff","background":"#faf8ff","surface-container-lowest":"#ffffff","inverse-on-surface":"#eef0ff","surface-container":"#eaedff","on-tertiary":"#ffffff","on-error-container":"#93000a","surface-container-low":"#f2f3ff","on-primary":"#ffffff","primary-fixed":"#dbe1ff","on-surface":"#131b2e","secondary-fixed-dim":"#b7c8e1","surface-container-highest":"#dae2fd","on-tertiary-fixed":"#360f00","on-tertiary-container":"#ffede6","secondary":"#505f76","on-tertiary-fixed-variant":"#7d2d00","outline-variant":"#c3c6d7","on-error":"#ffffff","on-secondary-fixed-variant":"#38485d","primary":"#004ac6","tertiary-fixed":"#ffdbcd","primary-fixed-dim":"#b4c5ff","tertiary":"#943700","inverse-surface":"#283044","surface-container-high":"#e2e7ff","on-primary-container":"#eeefff","surface-dim":"#d2d9f4","on-secondary-container":"#54647a","tertiary-container":"#bc4800","error-container":"#ffdad6","on-background":"#131b2e","secondary-fixed":"#d3e4fe","on-primary-fixed-variant":"#003ea8","surface-variant":"#dae2fd","primary-container":"#2563eb","tertiary-fixed-dim":"#ffb596"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"space-2xl":"3rem","space-sm":"0.5rem","space-md":"1rem","space-lg":"1.5rem","space-xs":"0.25rem","gutter":"1.5rem","margin":"2rem","space-xl":"2rem"},"fontFamily":{"headline-sm":["Inter"],"display-metric":["Inter"],"metric-large":["Inter"],"detail-link":["Inter"],"badge-label":["Inter"],"body-medium":["Inter"],"body-default":["Inter"],"card-label":["Inter"]},"fontSize":{"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"display-metric":["56px",{"lineHeight":"60px","letterSpacing":"-0.03em","fontWeight":"700"}],"metric-large":["44px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"600"}],"detail-link":["14px",{"lineHeight":"20px","fontWeight":"500"}],"badge-label":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"body-medium":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-default":["14px",{"lineHeight":"20px","fontWeight":"400"}],"card-label":["14px",{"lineHeight":"20px","letterSpacing":"0.05em","fontWeight":"500"}]}}}}</script></head><body class="bg-surface font-body-default text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex flex-col items-center justify-center p-4 sm:p-margin relative selection:bg-primary-container selection:text-white"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-2rem)] relative overflow-hidden py-8">
<!-- Ambient background gradients -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary-fixed/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- Interactive State Switcher Pill Navigation -->
<div class="z-20 mb-6 flex flex-wrap items-center justify-center gap-1.5 p-1.5 bg-surface-container-lowest/90 backdrop-blur-md rounded-2xl border border-surface-container-high/60 shadow-sm text-xs font-medium">
<button class="state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer bg-primary-container text-white shadow-xs" id="state-btn-default" onclick="setScreenState('default')">
    Default
  </button>
<button class="state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer text-secondary hover:text-on-surface hover:bg-surface-container-low" id="state-btn-error" onclick="setScreenState('error')">
    1. Error
  </button>
<button class="state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer text-secondary hover:text-on-surface hover:bg-surface-container-low" id="state-btn-locked" onclick="setScreenState('locked')">
    2. Locked
  </button>
<button class="state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer text-secondary hover:text-on-surface hover:bg-surface-container-low" id="state-btn-pin" onclick="setScreenState('pin')">
    3. PIN Mode
  </button>
<button class="state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer text-secondary hover:text-on-surface hover:bg-surface-container-low" id="state-btn-expired" onclick="setScreenState('expired')">
    4. Session Expired
  </button>
</div>
<!-- State 4 Notice Banner (Session Expired) -->
<div class="hidden w-full max-w-[400px] mb-3.5 z-10 transition-all duration-200" id="session-expired-banner">
<div class="w-full bg-[#FFFBEB] border border-[#FDE68A] text-[#92400E] px-4 py-3 rounded-2xl flex items-center gap-2.5 shadow-sm">
<span class="material-symbols-outlined text-[20px] text-[#D97706] shrink-0" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-body-medium text-xs sm:text-[13px] font-medium leading-tight">Session expired, please sign in again</span>
</div>
</div>
<!-- Centralized Auth Card -->
<div class="relative w-full max-w-[400px] bg-surface-container-lowest rounded-[24px] shadow-sm p-8 sm:p-10 flex flex-col items-center border border-surface-container-high/40 transition-all duration-200 z-10">
<!-- Brand Logo & Telemetry Mark -->
<div class="flex flex-col items-center text-center mb-7">
<div class="w-12 h-12 rounded-2xl bg-surface-container-low flex items-center justify-center text-primary-container mb-3 shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">air</span>
</div>
<div class="font-headline-sm text-headline-sm text-on-surface tracking-tight">
        VOC / E-Nose
      </div>
<div class="font-badge-label text-badge-label tracking-[0.2em] uppercase text-secondary mt-1">
        Telemetry System
      </div>
</div>
<!-- Title & Mode switcher link -->
<div class="w-full flex items-center justify-between mb-6">
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold" id="screen-heading">
    Sign in
  </h1>
<button class="text-primary-container hover:text-primary font-body-medium text-xs flex items-center gap-1 transition-colors cursor-pointer" id="pin-toggle-link" onclick="togglePinModeDirect()" type="button">
<span class="material-symbols-outlined text-[16px]">dialpad</span>
<span>Use PIN</span>
</button>
</div>
<!-- View A: Standard Password / Credential Mode Form -->
<form class="w-full flex flex-col gap-4" id="standard-form" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-1.5" id="username-wrapper">
<label class="font-card-label text-card-label text-on-surface-variant font-medium text-xs uppercase tracking-wider" for="username">
          Username
        </label>
<div class="relative w-full">
<input autocomplete="username" class="w-full h-11 px-4 text-on-surface placeholder:text-outline bg-surface-container-low rounded-xl font-body-default text-body-default outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container/20 border border-transparent" id="username" name="username" placeholder="Enter your ID or email" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5" id="password-wrapper">
<label class="font-card-label text-card-label text-on-surface-variant font-medium text-xs uppercase tracking-wider" for="password">
          Password
        </label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-11 pl-4 pr-11 text-on-surface placeholder:text-outline bg-surface-container-low rounded-xl font-body-default text-body-default outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container/20 border border-transparent" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 text-secondary hover:text-on-surface transition-colors flex items-center justify-center cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- State 1 Error Notice Line -->
<div class="hidden flex items-center gap-1.5 text-[#EF4444] text-xs font-medium -mt-1 transition-all" id="error-message-row">
<span class="material-symbols-outlined text-[16px] shrink-0" style="font-variation-settings: 'FILL' 1;">error</span>
<span>Wrong username or password</span>
</div>
<!-- Submit Action Button -->
<button class="w-full h-11 mt-1 bg-primary-container hover:bg-primary text-on-primary font-body-medium text-body-medium rounded-xl flex items-center justify-center transition-all duration-200 shadow-sm hover:shadow active:scale-[0.99] cursor-pointer" id="submit-btn" type="submit">
  Sign In
</button>
<!-- Role Selection Quick Pills -->
<div class="flex items-center justify-center gap-2 pt-2" id="rolePillGroup">
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'ADMIN-094')" type="button">
          Admin
        </button>
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'ENG-512')" type="button">
          Engineer
        </button>
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'OPR-108')" type="button">
          Operator
        </button>
</div>
</form>
<!-- View B: PIN Entry Mode Form (State 3) -->
<div class="hidden w-full flex-col items-center" id="pin-mode-view">
<p class="font-body-default text-xs text-secondary mb-4 text-center">
    Enter your 6-digit security PIN to unlock telemetry terminal
  </p>
<!-- 6-dot indicator -->
<div class="flex items-center justify-center gap-3.5 my-3 mb-6" id="pin-dots">
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant transition-all duration-150"></div>
</div>
<!-- Large Touch-friendly Numeric Keypad (1-9, clear, 0, backspace) -->
<div class="grid grid-cols-3 gap-3 w-full max-w-[280px] mx-auto">
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('1')" type="button">1</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('2')" type="button">2</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('3')" type="button">3</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('4')" type="button">4</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('5')" type="button">5</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('6')" type="button">6</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('7')" type="button">7</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('8')" type="button">8</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('9')" type="button">9</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-secondary text-xs uppercase tracking-wider font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="clearPin()" type="button">Clear</button>
<button class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface text-xl font-semibold flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="pressPinKey('0')" type="button">0</button>
<button aria-label="Backspace" class="h-14 w-full rounded-2xl bg-surface-container-low hover:bg-surface-container text-secondary flex items-center justify-center active:scale-95 transition-all cursor-pointer" onclick="backspacePin()" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
<!-- Text link to return to password mode -->
<button class="mt-5 text-secondary hover:text-primary-container font-body-medium text-xs inline-flex items-center gap-1.5 transition-colors cursor-pointer py-1" onclick="setScreenState('default')" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Return to password sign in</span>
</button>
</div>
</div>
<!-- Bottom Security Text -->
<div class="mt-6 flex items-center justify-center gap-1.5 text-secondary text-xs tracking-tight">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>Authorized personnel only. Activity is logged.</span>
</div>
</div>
<script>
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');
  const usernameInput = document.getElementById('username');
  const errorMsgRow = document.getElementById('error-message-row');
  const submitBtn = document.getElementById('submit-btn');
  const sessionBanner = document.getElementById('session-expired-banner');
  const standardForm = document.getElementById('standard-form');
  const pinModeView = document.getElementById('pin-mode-view');
  const screenHeading = document.getElementById('screen-heading');
  const pinToggleLink = document.getElementById('pin-toggle-link');
  const roleGroup = document.getElementById('rolePillGroup');

  let currentPin = '';

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  function selectRole(button, idValue) {
    document.querySelectorAll('.role-pill').forEach(pill => {
      pill.classList.remove('bg-secondary-container', 'text-on-secondary-fixed');
      pill.classList.add('bg-surface-container-low', 'text-secondary');
    });
    button.classList.remove('bg-surface-container-low', 'text-secondary');
    button.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
    usernameInput.value = idValue;
    passwordInput.focus();
  }

  function updatePillStyles(activeKey) {
    const states = ['default', 'error', 'locked', 'pin', 'expired'];
    states.forEach(state => {
      const btn = document.getElementById(`state-btn-${state}`);
      if (!btn) return;
      if (state === activeKey) {
        btn.className = 'state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer bg-primary-container text-white shadow-xs';
      } else {
        btn.className = 'state-pill px-3 py-1.5 rounded-xl font-body-medium transition-all duration-150 cursor-pointer text-secondary hover:text-on-surface hover:bg-surface-container-low';
      }
    });
  }

  function setScreenState(stateKey) {
    updatePillStyles(stateKey);

    // Reset base states
    sessionBanner.classList.add('hidden');
    standardForm.classList.remove('hidden');
    pinModeView.classList.add('hidden');
    pinModeView.classList.remove('flex');
    screenHeading.textContent = 'Sign in';
    pinToggleLink.classList.remove('hidden');
    
    // Clear field alerts / borders
    usernameInput.disabled = false;
    passwordInput.disabled = false;
    usernameInput.classList.remove('border-[#EF4444]', 'focus:ring-red-200', 'opacity-60', 'cursor-not-allowed', 'bg-surface-container-high/60');
    passwordInput.classList.remove('border-[#EF4444]', 'focus:ring-red-200', 'opacity-60', 'cursor-not-allowed', 'bg-surface-container-high/60');
    errorMsgRow.classList.add('hidden');
    
    // Reset submit button
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';
    submitBtn.className = 'w-full h-11 mt-1 bg-primary-container hover:bg-primary text-on-primary font-body-medium text-body-medium rounded-xl flex items-center justify-center transition-all duration-200 shadow-sm hover:shadow active:scale-[0.99] cursor-pointer';

    // State 1: Error
    if (stateKey === 'error') {
      usernameInput.classList.add('border-[#EF4444]');
      passwordInput.classList.add('border-[#EF4444]');
      errorMsgRow.classList.remove('hidden');
    }

    // State 2: Locked
    else if (stateKey === 'locked') {
      usernameInput.disabled = true;
      passwordInput.disabled = true;
      usernameInput.classList.add('opacity-60', 'cursor-not-allowed', 'bg-surface-container-high/60');
      passwordInput.classList.add('opacity-60', 'cursor-not-allowed', 'bg-surface-container-high/60');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Try again in 00:58';
      submitBtn.className = 'w-full h-11 mt-1 bg-surface-container-highest text-secondary opacity-80 font-body-medium text-body-medium rounded-xl flex items-center justify-center transition-all duration-200 shadow-none cursor-not-allowed';
    }

    // State 3: PIN Mode
    else if (stateKey === 'pin') {
      standardForm.classList.add('hidden');
      pinModeView.classList.remove('hidden');
      pinModeView.classList.add('flex');
      screenHeading.textContent = 'PIN Verification';
      pinToggleLink.classList.add('hidden');
      currentPin = '130';
      renderPinDots();
    }

    // State 4: Session Expired
    else if (stateKey === 'expired') {
      sessionBanner.classList.remove('hidden');
    }
  }

  function togglePinModeDirect() {
    setScreenState('pin');
  }

  function pressPinKey(digit) {
    if (currentPin.length < 6) {
      currentPin += digit;
      renderPinDots();
    }
  }

  function clearPin() {
    currentPin = '';
    renderPinDots();
  }

  function backspacePin() {
    currentPin = currentPin.slice(0, -1);
    renderPinDots();
  }

  function renderPinDots() {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((dot, index) => {
      if (index < currentPin.length) {
        dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-primary-container border-2 border-primary-container scale-110 transition-all duration-150';
      } else {
        dot.className = 'pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline-variant bg-transparent transition-all duration-150';
      }
    });
  }

  // Initialize Default State
  setScreenState('default');
</script></main></body></html>
