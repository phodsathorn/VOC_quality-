<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-primary-fixed":"#00174b","on-secondary":"#ffffff","surface":"#faf8ff","surface-tint":"#0053db","outline":"#737686","on-surface-variant":"#434655","error":"#ba1a1a","secondary-container":"#d0e1fb","on-secondary-fixed":"#0b1c30","inverse-primary":"#b4c5ff","surface-bright":"#faf8ff","background":"#faf8ff","surface-container-lowest":"#ffffff","inverse-on-surface":"#eef0ff","surface-container":"#eaedff","on-tertiary":"#ffffff","on-error-container":"#93000a","surface-container-low":"#f2f3ff","on-primary":"#ffffff","primary-fixed":"#dbe1ff","on-surface":"#131b2e","secondary-fixed-dim":"#b7c8e1","surface-container-highest":"#dae2fd","on-tertiary-fixed":"#360f00","on-tertiary-container":"#ffede6","secondary":"#505f76","on-tertiary-fixed-variant":"#7d2d00","outline-variant":"#c3c6d7","on-error":"#ffffff","on-secondary-fixed-variant":"#38485d","primary":"#004ac6","tertiary-fixed":"#ffdbcd","primary-fixed-dim":"#b4c5ff","tertiary":"#943700","inverse-surface":"#283044","surface-container-high":"#e2e7ff","on-primary-container":"#eeefff","surface-dim":"#d2d9f4","on-secondary-container":"#54647a","tertiary-container":"#bc4800","error-container":"#ffdad6","on-background":"#131b2e","secondary-fixed":"#d3e4fe","on-primary-fixed-variant":"#003ea8","surface-variant":"#dae2fd","primary-container":"#2563eb","tertiary-fixed-dim":"#ffb596"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"space-2xl":"3rem","space-sm":"0.5rem","space-md":"1rem","space-lg":"1.5rem","space-xs":"0.25rem","gutter":"1.5rem","margin":"2rem","space-xl":"2rem"},"fontFamily":{"headline-sm":["Inter"],"display-metric":["Inter"],"metric-large":["Inter"],"detail-link":["Inter"],"badge-label":["Inter"],"body-medium":["Inter"],"body-default":["Inter"],"card-label":["Inter"]},"fontSize":{"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"display-metric":["56px",{"lineHeight":"60px","letterSpacing":"-0.03em","fontWeight":"700"}],"metric-large":["44px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"600"}],"detail-link":["14px",{"lineHeight":"20px","fontWeight":"500"}],"badge-label":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"body-medium":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-default":["14px",{"lineHeight":"20px","fontWeight":"400"}],"card-label":["14px",{"lineHeight":"20px","letterSpacing":"0.05em","fontWeight":"500"}]}}}}</script></head><body class="bg-surface font-body-default text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex items-center justify-center p-margin"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)] relative overflow-hidden py-12">
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary-fixed/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative w-full max-w-[400px] bg-surface-container-lowest rounded-[24px] shadow-sm p-8 sm:p-10 flex flex-col items-center">
<!-- Brand Logo & Telemetry Mark -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-12 h-12 rounded-2xl bg-surface-container-low flex items-center justify-center text-primary-container mb-3 shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">air</span>
</div>
<div class="font-headline-sm text-headline-sm text-on-surface tracking-tight">
        VOC / E-Nose
      </div>
<div class="font-badge-label text-badge-label tracking-[0.2em] uppercase text-secondary mt-1">
        Telemetry System
      </div>
</div>
<!-- Title -->
<div class="w-full text-left mb-6">
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold">
        Sign in
      </h1>
</div>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-1.5">
<label class="font-card-label text-card-label text-on-surface-variant font-medium text-xs uppercase tracking-wider" for="username">
          Username
        </label>
<div class="relative w-full">
<input autocomplete="username" class="w-full h-11 px-4 text-on-surface placeholder:text-outline bg-surface-container-low rounded-xl font-body-default text-body-default outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container/20" id="username" name="username" placeholder="Enter your ID or email" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-card-label text-card-label text-on-surface-variant font-medium text-xs uppercase tracking-wider" for="password">
          Password
        </label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-11 pl-4 pr-11 text-on-surface placeholder:text-outline bg-surface-container-low rounded-xl font-body-default text-body-default outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container/20" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 text-secondary hover:text-on-surface transition-colors flex items-center justify-center cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<button class="w-full h-11 mt-2 bg-primary-container hover:bg-primary text-on-primary font-body-medium text-body-medium rounded-xl flex items-center justify-center transition-all duration-200 shadow-sm hover:shadow active:scale-[0.99] cursor-pointer" type="submit">
        Sign In
      </button>
<!-- Role Selection Quick Pills -->
<div class="flex items-center justify-center gap-2 pt-2" id="rolePillGroup">
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'ADMIN-094')" type="button">
          Admin
        </button>
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'ENG-512')" type="button">
          Engineer
        </button>
<button class="role-pill px-3 py-1 bg-surface-container-low hover:bg-surface-container text-secondary hover:text-on-surface font-badge-label text-badge-label rounded-full transition-all duration-150 cursor-pointer" onclick="selectRole(this, 'OPR-108')" type="button">
          Operator
        </button>
</div>
</form>
</div>
</div>
<script>
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');
  const usernameInput = document.getElementById('username');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  function selectRole(button, idValue) {
    document.querySelectorAll('.role-pill').forEach(pill => {
      pill.classList.remove('bg-secondary-container', 'text-on-secondary-fixed');
      pill.classList.add('bg-surface-container-low', 'text-secondary');
    });
    button.classList.remove('bg-surface-container-low', 'text-secondary');
    button.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
    usernameInput.value = idValue;
    passwordInput.focus();
  }
</script></main></body></html>
