<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">VOC Quality Monitor V2 preliminary circuit and PCB layout</title>
  <desc id="desc">A conceptual backplane layout with replaceable sensor modules connected through JST-XH connectors, controller, low voltage power, DC fans and isolated load control.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .board { fill: #ffffff; stroke: #163b65; stroke-width: 7; }
      .zone { stroke-width: 3; rx: 22; }
      .title { font: 700 38px Arial, sans-serif; fill: #102a43; }
      .sub { font: 400 21px Arial, sans-serif; fill: #486581; }
      .zoneTitle { font: 700 24px Arial, sans-serif; fill: #102a43; }
      .label { font: 700 19px Arial, sans-serif; fill: #102a43; }
      .small { font: 400 16px Arial, sans-serif; fill: #334e68; }
      .chip { stroke: #163b65; stroke-width: 2; rx: 12; }
      .wire { fill: none; stroke: #237a57; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #3178c6; stroke-width: 5; stroke-dasharray: 12 10; marker-end: url(#arrowBlue); }
      .warn { font: 700 17px Arial, sans-serif; fill: #9c2c2c; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#237a57"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3178c6"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="70" class="title">VOC Quality Monitor v2 — ผังวงจรและ PCB (แบบร่าง)</text>
  <text x="70" y="105" class="sub">Backplane PCB ต่อ sensor module ผ่าน JST-XH • เปลี่ยนชิ้นส่วนง่ายและแยกโซนไฟเลี้ยง/โหลด</text>

  <rect x="65" y="145" width="1470" height="745" rx="34" class="board"/>
  <text x="104" y="185" class="label">BACKPLANE PCB — LOW VOLTAGE ONLY</text>

  <!-- removable sensor connector zone -->
  <rect x="95" y="215" width="705" height="395" fill="#e7f7f1" stroke="#237a57" class="zone"/>
  <text x="125" y="255" class="zoneTitle">A. Removable sensor connectors</text>
  <text x="125" y="285" class="small">JST-XH ไป sensor module / บอร์ดไข่ปลาใกล้ช่องรับอากาศ</text>
  <rect x="125" y="325" width="145" height="85" fill="#fff" class="chip"/>
  <text x="162" y="363" class="label">J10</text><text x="140" y="390" class="small">SHT41 module</text>
  <rect x="290" y="325" width="145" height="85" fill="#fff" class="chip"/>
  <text x="330" y="363" class="label">J11</text><text x="306" y="390" class="small">SCD41 module</text>
  <rect x="455" y="325" width="145" height="85" fill="#fff" class="chip"/>
  <text x="495" y="363" class="label">J12</text><text x="470" y="390" class="small">SGP41 module</text>
  <rect x="620" y="325" width="145" height="85" fill="#fff" class="chip"/>
  <text x="653" y="363" class="label">J13</text><text x="637" y="390" class="small">BME690 module</text>
  <rect x="125" y="445" width="195" height="115" fill="#fff" class="chip"/>
  <text x="178" y="486" class="label">J14</text><text x="151" y="514" class="small">SPS30 module</text><text x="162" y="541" class="small">5 V + I²C/UART</text>
  <rect x="350" y="445" width="195" height="115" fill="#fff" class="chip"/>
  <text x="392" y="486" class="label">J16</text><text x="376" y="514" class="small">ADS1115 module</text><text x="374" y="541" class="small">MiCS-6814 E-Nose</text>
  <rect x="575" y="445" width="190" height="115" fill="#dff0ff" class="chip"/>
  <text x="603" y="486" class="label">TCA9548A</text><text x="599" y="514" class="small">I²C multiplexer</text><text x="600" y="541" class="small">3.3 V I²C buses</text>

  <!-- controller -->
  <rect x="835" y="215" width="665" height="250" fill="#e7effa" stroke="#3178c6" class="zone"/>
  <text x="865" y="255" class="zoneTitle">B. Controller / HMI zone</text>
  <rect x="875" y="295" width="360" height="120" fill="#fff" class="chip"/>
  <text x="945" y="342" class="label">ESP32-S3 + 5” Touch LCD</text>
  <text x="928" y="372" class="small">Web UI • Wi-Fi • OTA • data logging</text>
  <rect x="1270" y="295" width="185" height="120" fill="#fff" class="chip"/>
  <text x="1312" y="342" class="label">J-HMI</text>
  <text x="1296" y="372" class="small">SDA/SCL + GPIO</text>

  <!-- power & load -->
  <rect x="835" y="500" width="665" height="350" fill="#fff2df" stroke="#ce7e00" class="zone"/>
  <text x="865" y="540" class="zoneTitle">C. Power + DC load zone</text>
  <rect x="875" y="580" width="170" height="105" fill="#fff" class="chip"/>
  <text x="913" y="621" class="label">DC INPUT</text><text x="891" y="650" class="small">Fuse + TVS + reverse</text><text x="903" y="672" class="small">polarity protection</text>
  <rect x="1080" y="580" width="160" height="105" fill="#fff" class="chip"/>
  <text x="1114" y="621" class="label">5 V rail</text><text x="1104" y="650" class="small">SPS30 / fan / HMI</text>
  <rect x="1275" y="580" width="160" height="105" fill="#fff" class="chip"/>
  <text x="1302" y="621" class="label">3.3 V rail</text><text x="1298" y="650" class="small">clean sensor rail</text>
  <rect x="875" y="720" width="170" height="90" fill="#fff" class="chip"/>
  <text x="916" y="757" class="label">INA226</text><text x="892" y="784" class="small">current / fault trend</text>
  <rect x="1080" y="720" width="160" height="90" fill="#fff" class="chip"/>
  <text x="1112" y="757" class="label">MOSFET</text><text x="1100" y="784" class="small">DC FAN 1 / FAN 2</text>
  <rect x="1275" y="720" width="160" height="90" fill="#fff" class="chip"/>
  <text x="1315" y="757" class="label">PC817</text><text x="1293" y="784" class="small">isolated command out</text>

  <path d="M765 500 L875 500 L875 355" class="signal"/>
  <path d="M1045 632 L1080 632" class="wire"/>
  <path d="M1240 632 L1275 632" class="wire"/>
  <path d="M1235 355 L1270 355" class="signal"/>
  <path d="M1045 765 L1080 765" class="wire"/>
  <path d="M1235 765 L1275 765" class="signal"/>

  <rect x="95" y="915" width="1435" height="54" rx="12" fill="#fde8e8" stroke="#b83232" stroke-width="2"/>
  <text x="120" y="949" class="warn">ข้อจำกัดด้านความปลอดภัย: ภาค AC / SSR / contactor ต้องอยู่นอก PCB นี้ในกล่องไฟแยก และออกแบบตามชนิดโหลดโดยช่างไฟฟ้า</text>
</svg>
