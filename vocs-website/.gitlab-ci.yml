stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  # DOCKER_TLS_CERTDIR: "" is needed for dind in some runners
  DOCKER_TLS_CERTDIR: ""

# ====================================================
# STAGE: BUILD
# ====================================================
build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Building Backend Image..."
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHA -t $BACKEND_IMAGE:latest ./backend
    - echo "Pushing to GitLab Registry..."
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - docker-compose.prod.yml

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Building Frontend Image..."
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHA -t $FRONTEND_IMAGE:latest ./frontend
    - echo "Pushing to GitLab Registry..."
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
        - docker-compose.prod.yml

# ====================================================
# STAGE: DEPLOY
# ====================================================
deploy_production:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build_backend
      optional: true
    - job: build_frontend
      optional: true
  before_script:
    # ติดตั้ง SSH client
    - apk add --no-cache openssh-client
    # รัน SSH Agent และเพิ่ม Private Key
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # เตรียม known_hosts
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEPLOY_SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to Production Server ($DEPLOY_SERVER_IP)..."
    # คัดลอก docker-compose.prod.yml ไปยัง Server ก่อน
    - scp docker-compose.prod.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:$DEPLOY_PATH/docker-compose.yml
    # สั่งให้ Server login เข้า GitLab Registry, pull รูปใหม่, และ start container
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "
        echo '$CI_REGISTRY_PASSWORD' | docker login $CI_REGISTRY -u '$CI_REGISTRY_USER' --password-stdin &&
        cd $DEPLOY_PATH &&
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE &&
        docker compose pull &&
        docker compose up -d --remove-orphans
      "
    - echo "Deployment Successful!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
